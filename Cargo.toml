[package]
name = "solana-pay"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of the Solana Pay specification"
license = "MIT"
repository = "https://github.com/skylinesales/silver-broccoli"

[dependencies]
solana-sdk = "1.17"
spl-token = "4.0"
spl-associated-token-account = "2.3"
spl-memo = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.4"
urlencoding = "2.1"
thiserror = "1.0"
bs58 = "0.5"
rust_decimal = "1.32"
qr_code = "2.0"
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }